version: '3.8'

services:
  # ========================================
  # 服务 1: Reflex 前端（新版）
  # ========================================
  web:
    build: .
    container_name: yurara-web-reflex
    restart: always
    ports:
      - "8080:8080"  # Reflex 后端 + WebSocket
      - "3000:3000"  # Reflex 前端（开发模式）
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_CREDENTIALS=${APP_CREDENTIALS}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - yurara-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  # ========================================
  # 服务 3: Discord Bot
  # ========================================
  bot:
    build: .
    container_name: yurara-bot
    restart: always
    command: python bot.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - yurara-net
    healthcheck:
      disable: true

networks:
  yurara-net:
    driver: bridge