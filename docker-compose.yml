version: '3.8'

services:
  # ========================================
  # 服务 1: Reflex 前端（新版）
  # ========================================
  web:
    build: .
    container_name: yurara-web-reflex
    restart: always
    ports:
      - "8080:8080"  # Reflex 统一生产端口（合并前后端）
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_CREDENTIALS=${APP_CREDENTIALS}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - yurara-net


  # ========================================
  # 服务 3: Discord Bot
  # ========================================
  bot:
    build: .
    container_name: yurara-bot
    restart: always
    command: python bot.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_ALLOWED_CHANNEL_ID=${DISCORD_ALLOWED_CHANNEL_ID}
    networks:
      - yurara-net
networks:
  yurara-net:
    driver: bridge